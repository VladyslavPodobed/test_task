[defaults]
# Default remote user for SSH connections
remote_user = root

# Use YAML-formatted results for better readability
stdout_callback = default
callback_result_format = yaml

# Timeout for SSH connections in seconds
timeout = 30

# Reuse cached facts when possible
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600

# Show execution time per task
callbacks_enabled = timer, profile_tasks

# Disable host key checking
host_key_checking = False

[privilege_escalation]
# Default privilege escalation settings
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Enable SSH pipelining for better performance
pipelining = True

[diff]
# Always show diffs when files change
always = True
context = 3
