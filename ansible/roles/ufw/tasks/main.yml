- name: check if ufw is installed
  ansible.builtin.apt:
    state: "present"
    update_cache: true
    name: ufw


- name: allow ssh
  community.general.ufw:
    rule: allow
    to_port: "22"
    proto: tcp
  
- name: allow http
  community.general.ufw:
    rule: allow
    to_port: "80"
    proto: tcp

- name: default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: default allow outgoing
  community.general.ufw:
    default: allow
    direction: outgoing

- name: enable ufw
  community.general.ufw:
    state: enabled

- name: reload ufw
  ansible.builtin.command: ufw reload
