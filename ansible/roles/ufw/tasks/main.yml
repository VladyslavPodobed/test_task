- name: check if ufw is installed
  ansible.builtin.apt:
    state: "present"
    update_cache: true
    name: ufw


- name: allow ssh
  community.general.ufw:
    default: "allow"
    to_port: "22"
    proto: "tcp"
  
- name: allow http
  community.general.ufw:
    default: "allow"
    to_port: "80"
    proto: "tcp"

- name: enable ufw
  community.general.ufw:
    state: "enabled"
    default: "deny"
    direction: "incoming"
